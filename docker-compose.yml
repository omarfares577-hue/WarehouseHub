
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=WarehouseHub123!
    ports:
      - "1433:1433"
    restart: always

  warehouse-api:
    image: warehouse-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=WareHouseHub;User Id=sa;Password=WarehouseHub123!;TrustServerCertificate=True;Encrypt=True;
      - ConnectionStrings__IdentityConnection=Server=sqlserver,1433;Database=WareHouseHubIdentity;User Id=sa;Password=WarehouseHub123!;TrustServerCertificate=True;Encrypt=True;
    depends_on:
      - sqlserver